# LEVELS — Nivel de tinaco con XIAO ESP32C3 + JSN-SR04T + OLED 128x32
# Conexiones (XIAO ESP32C3):
#   Alimentación: cargador de 5 V al USB-C del XIAO (única entrada, sin diodo).
#   JSN-SR04T 5V   -> pin 5V del XIAO (+ 220 µF y 100 nF a GND junto al XIAO)
#   JSN-SR04T GND  -> GND
#   JSN-SR04T Trig -> 100 Ω -> D2 (GPIO4)  (3.3 V es suficiente para disparar)
#   JSN-SR04T Echo -> divisor: Echo --1k--+--> D3 (GPIO5)
#                                         |
#                                        2k
#                                         |
#                                        GND
#   OLED SDA -> D4 (GPIO6), OLED SCL -> D5 (GPIO7), VCC -> 3V3, GND -> GND
# Sensor en modo 1 (pad de modo R27 sin resistencia).

substitutions:
  # Tinaco: 1.40 m de profundidad, agua llena a 1.20 m (20 cm bajo la tapa).
  # El sensor va elevado ~15 cm sobre la tapa para librar la zona ciega (~25 cm).
  dist_lleno: "0.35"    # m: sensor -> agua con el tinaco LLENO (0.20 + 0.15). Mídela.
  dist_vacio: "1.55"    # m: sensor -> SALIDA del tinaco (multiconector), no al fondo:
                        #    dist_lleno + (altura agua llena - altura de la salida). 0 % = ya no sale agua.
  capacidad_l: "1100"   # litros ÚTILES entre dist_lleno y dist_vacio, no los de la etiqueta:
                        #    pi * (diametro_interior / 2)^2 * (dist_vacio - dist_lleno) * 1000

esphome:
  name: tinaco
  friendly_name: Tinaco

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Tinaco Fallback"

captive_portal:

i2c:
  sda: GPIO6
  scl: GPIO7

sensor:
  - platform: ultrasonic
    trigger_pin: GPIO4
    echo_pin: GPIO5
    name: "Distancia al agua"
    id: distancia
    update_interval: 2s
    timeout: 4m
    pulse_time: 20us
    filters:
      - filter_out: nan
      - median:            # descarta rebotes en paredes / gotas de condensación
          window_size: 9
          send_every: 5
          send_first_at: 3

  - platform: template
    name: "Nivel"
    id: nivel
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      float d = id(distancia).state;
      if (isnan(d)) return NAN;
      float p = (${dist_vacio} - d) / (${dist_vacio} - ${dist_lleno}) * 100.0f;
      return std::min(100.0f, std::max(0.0f, p));

  - platform: template
    name: "Litros"
    id: litros
    unit_of_measurement: "L"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (isnan(id(nivel).state)) return NAN;
      return id(nivel).state * ${capacidad_l} / 100.0f;

  - platform: wifi_signal
    name: "Señal WiFi"
    update_interval: 60s

button:
  - platform: restart
    name: "Reiniciar"

font:
  - file: "gfonts://Roboto@700"
    id: f_big
    size: 24
  - file: "gfonts://Roboto"
    id: f_small
    size: 10

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x32"
    address: 0x3C
    update_interval: 2s
    lambda: |-
      float n = id(nivel).state;
      if (isnan(n)) {
        it.print(0, 10, id(f_small), "Sin lectura del sensor");
        return;
      }
      // Porcentaje grande a la izquierda
      it.printf(0, 3, id(f_big), "%.0f%%", n);
      // Barra a la derecha (60 px = 100 %)
      it.rectangle(66, 0, 62, 18);
      it.filled_rectangle(67, 1, (int)(n * 0.60f), 16);
      // Litros debajo de la barra
      it.printf(127, 31, id(f_small), TextAlign::BOTTOM_RIGHT, "%.0f L", id(litros).state);
